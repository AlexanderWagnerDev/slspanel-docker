services:
  slspanel:
    image: alexanderwagnerdev/slspanel:latest
    container_name: slspanel
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - LANG=${LANG:-en}
      - TZ=${TZ:-UTC}
      - SLS_API_URL=${SLS_API_URL:-http://sls-api-url:8789}
      - SLS_API_KEY=${SLS_API_KEY:-yourapikey}
      - SRT_PUBLISH_PORT=${SRT_PUBLISH_PORT:-4001}
      - SRT_PLAYER_PORT=${SRT_PLAYER_PORT:-4000}
      - SRTLA_PUBLISH_PORT=${SRTLA_PUBLISH_PORT:-5000}
      - SLS_DOMAIN_IP=${SLS_DOMAIN_IP:-your-sls-domain-sls-domain-ip}
      - SLS_STATS_DOMAIN_IP=${SLS_STATS_DOMAIN_IP:-your-sls-stats-domain-sls-domain-ip}
      - SLS_STATS_PORT=${SLS_STATS_PORT:-8789}
      - SLS_STATS_SCHEME=${SLS_STATS_SCHEME:-http}
      - REQUIRE_LOGIN=${REQUIRE_LOGIN:-True}
      # USERNAME and PASSWORD are read from .env; see .env.example.
      # Optional: required when running behind a reverse proxy (e.g. Cloudflare Tunnel)
      # - CSRF_TRUSTED_ORIGINS=https://mydomain.com,https://*.trycloudflare.com
      # - SECURE_PROXY_SSL_HEADER=true
    ports:
      - "8000:8000/tcp"
